name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'code_review/requirements.txt'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r code_review/requirements.txt
          npm install -g @modelcontextprotocol/server-github

      - name: Restore RAG cache
        uses: actions/cache@v4
        with:
          path: .cache/rag_index.json
          key: rag-${{ hashFiles('**/*.py', '**/*.js', '**/*.ts', 'README.md', 'CONTRIBUTING.md') }}
          restore-keys: |
            rag-

      - name: Build RAG index if missing
        run: |
          if [ ! -f .cache/rag_index.json ]; then
            echo "RAG cache not found, building index..."
            python -m code_review.build_index
          else
            echo "RAG cache found, skipping build"
          fi

      - name: Run AI Code Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIGACHAT_CREDENTIALS: ${{ secrets.GIGACHAT_CREDENTIALS }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT_ROOT: ${{ github.workspace }}
        run: python -m code_review.github_action

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ AI code review failed. Check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
